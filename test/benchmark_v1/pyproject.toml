[project]
name = "ragflow-benchmark-v1"
version = "0.1.0"
description = "RAGFlow 性能压测套件（入库 / 检索 / 混合负载 / 长稳 / 并发用户场景）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # HTTP client for the RAGFlow REST API
    "requests>=2.31.0",
    # benchmark_config.yaml
    "PyYAML>=6.0.1",
    # latency percentiles
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.uv]
# This directory only describes an environment, it is not an installable package.
package = false

# Keep the lint settings local so that a standalone run does not inherit
# the rules of the parent RAGFlow project.
[tool.ruff]
line-length = 200
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
