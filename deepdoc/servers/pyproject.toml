[project]
name = "deepdoc-server"
version = "0.1.0"
description = "Unified DeepDoc Server with DLA, OCR, and TSR models"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core inference server
    "litserve==0.2.17",

    # Deep learning frameworks
    # Note: PaddlePaddle will be installed from Baidu's wheel in Dockerfile
    #       (GPU version with CUDA 12.8, CPU version without CUDA)
    "torch>=2.5.0",

    # Model utilities
    "onnx",
    "onnxruntime>=1.20.0",
    "ultralytics",

    # Image processing
    "opencv-python-headless",
    "numpy",
    "pillow",

    # Web framework
    "setuptools",
    "python-multipart",

    # Document layout analysis
    "doclayout-yolo",

    # OCR
    "paddleocr==2.10.0",
]

[dependency-groups]
gpu = [
    # GPU-specific dependencies for TensorRT and CUDA
    "tensorrt>=10.8.0,<11.0.0",
    "cuda-python>=11.8.0,<12.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "dla/**/*.py",
    "tsr/**/*.py",
    "deepdoc_svr.py",
]

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://paddle-whl.bj.bcebos.com/stable/cu128/"
explicit = true
