upstream ragflow_web_http {
    ip_hash;
    server 10.138.0.3:1880 max_fails=6 fail_timeout=1;
    server 10.138.0.4:1880 max_fails=6 fail_timeout=1;
    server 10.138.0.5:1880 max_fails=6 fail_timeout=1;
    server 10.138.0.6:1880 max_fails=6 fail_timeout=1;
    keepalive 100;
}
upstream ragflow_web_https {
    ip_hash;
    server 10.138.0.3:1443 max_fails=6 fail_timeout=1;
    server 10.138.0.4:1443 max_fails=6 fail_timeout=1;
    server 10.138.0.5:1443 max_fails=6 fail_timeout=1;
    server 10.138.0.6:1443 max_fails=6 fail_timeout=1;
    keepalive 100;
}
upstream upload {
    server 127.0.0.1:7788 max_fails=6 fail_timeout=1;
}
upstream casdoor_callback {
    ip_hash;
    server 127.0.0.1:8181 max_fails=6 fail_timeout=1;
}

server {
    listen 443 ssl;
    server_name demo.ragflow.io;
    ssl_certificate  /root/ragflow.https.cer;
    ssl_certificate_key   /root/ragflow.https.key;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    add_header 'Access-Control-Allow-Origin' 'https://login.ragflow.io';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With';
    add_header 'Access-Control-Allow-Credentials' 'true';

    location ^~ /dla_tsr {
        alias /home/ubuntu/uploader/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location / {
      proxy_pass https://ragflow_web_https;
      include proxy.conf;
    }

    # Cache-Control: max-age~@~AExpires
    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }
    location ~ .*\.(?:htm|html)$ {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
    }

}

server {
    listen 80;
    server_name demo.ragflow.io;
#    rewrite ^(.*)$ https://$host$1 permanent;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    add_header 'Access-Control-Allow-Origin' 'http://login.ragflow.io';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With';
    add_header 'Access-Control-Allow-Credentials' 'true';

    location / {
      proxy_pass http://ragflow_web_http;
      include proxy.conf;
    }

    # Cache-Control: max-age~@~AExpires
    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }

    location ~ .*\.(?:htm|html)$ {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
    }

}

server {
    listen 443 ssl;
    server_name login.ragflow.io;
    ssl_certificate  /root/ragflow.https.cer;
    ssl_certificate_key   /root/ragflow.https.key;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    location = / {
      return 301 /login/oauth/authorize?client_id=87fe30c13277b95d37b5&response_type=code&redirect_uri=https://demo.ragflow.io/v1/user/casdoor_callback&scope=read&state=casdoor;
    }
    location = /login {
      return 301 /login/oauth/authorize?client_id=87fe30c13277b95d37b5&response_type=code&redirect_uri=https://demo.ragflow.io/v1/user/casdoor_callback&scope=read&state=casdoor;
    }

    location / {
      proxy_pass http://casdoor_callback;
      include proxy.conf;
    }

}

