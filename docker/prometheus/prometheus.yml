global:
  scrape_interval: 60s      # How often to collect metrics.
  scrape_timeout: 10s       # Maximum time allowed for each scrape.
  evaluation_interval: 60s  # How often to evaluate recording and alerting rules.

rule_files:
  - expected_inventory.yml
  - component_availability_alerts.yml
  - minio_alerts.yml
  - minio_throughput_recording.yml
  - minio_throughput_alerts.yml
  - minio_disk_throughput_alerts.yml
  - mysql_alerts.yml
  - es_alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: prometheus

  - job_name: minio-job
    metrics_path: /minio/metrics/v3
    authorization:
      credentials_file: minio.token
    file_sd_configs:
      - files: ["targets/minio-job.json"]

  - job_name: clickhouse
    file_sd_configs:
      - files: ["targets/clickhouse.json"]

  - job_name: mysql
    file_sd_configs:
      - files: ["targets/mysql.json"]

  - job_name: kvrocks
    file_sd_configs:
      - files: ["targets/kvrocks.json"]

  - job_name: nats
    file_sd_configs:
      - files: ["targets/nats.json"]

  - job_name: elasticsearch
    file_sd_configs:
      - files: ["targets/elasticsearch.json"]
