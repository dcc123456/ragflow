groups:
- name: minio_throughput_recording
  # Match the 60-second scrape interval to avoid resampling counters twice.
  interval: 60s
  rules:
  # Silo v3 omits zero-valued metrics. Record zero-filled counters BEFORE
  # rate/increase so the first nonzero sample after idle is counted.
  # Failed scrapes produce no counter samples. Only healthy nodes with
  # process metrics can supply a missing counter's zero baseline.
  # Remove S3 type so network and process I/O retain the same node labels.
  - record: minio:network:received_bytes_total
    expr: |
      (
        sum without (type) (minio_api_requests_traffic_received_bytes{job="minio-job",type="s3"})
        or (0 * minio_system_process_uptime_seconds{job="minio-job"})
      ) and on (job, instance) (up{job="minio-job"} == 1)

  - record: minio:network:sent_bytes_total
    expr: |
      (
        sum without (type) (minio_api_requests_traffic_sent_bytes{job="minio-job",type="s3"})
        or (0 * minio_system_process_uptime_seconds{job="minio-job"})
      ) and on (job, instance) (up{job="minio-job"} == 1)

  - record: minio:disk:written_bytes_total
    expr: |
      (
        minio_system_process_io_write_bytes{job="minio-job"}
        or (0 * minio_system_process_uptime_seconds{job="minio-job"})
      ) and on (job, instance) (up{job="minio-job"} == 1)

  - record: minio:disk:read_bytes_total
    expr: |
      (
        minio_system_process_io_read_bytes{job="minio-job"}
        or (0 * minio_system_process_uptime_seconds{job="minio-job"})
      ) and on (job, instance) (up{job="minio-job"} == 1)

  # These rules run after the normalized counters in the same group.
  # Throughput is MiB/s; cumulative 24-hour values are GiB.
  - record: minio:network:write_throughput_mb_sec
    expr: rate(minio:network:received_bytes_total[5m]) / 1048576

  - record: minio:network:read_throughput_mb_sec
    expr: rate(minio:network:sent_bytes_total[5m]) / 1048576

  - record: minio:network:total_throughput_mb_sec
    expr: minio:network:write_throughput_mb_sec + minio:network:read_throughput_mb_sec

  - record: minio:disk:write_throughput_mb_sec
    expr: rate(minio:disk:written_bytes_total[5m]) / 1048576

  - record: minio:disk:read_throughput_mb_sec
    expr: rate(minio:disk:read_bytes_total[5m]) / 1048576

  - record: minio:disk:total_throughput_mb_sec
    expr: minio:disk:write_throughput_mb_sec + minio:disk:read_throughput_mb_sec

  - record: minio:efficiency:write_amplification
    expr: (minio:disk:write_throughput_mb_sec / minio:network:write_throughput_mb_sec) and (minio:network:write_throughput_mb_sec > 0)

  - record: minio:efficiency:read_efficiency
    expr: (minio:network:read_throughput_mb_sec / minio:disk:read_throughput_mb_sec) and (minio:disk:read_throughput_mb_sec > 0)

  - record: minio:network:daily_write_gb
    expr: increase(minio:network:received_bytes_total[24h]) / 1073741824

  - record: minio:network:daily_read_gb
    expr: increase(minio:network:sent_bytes_total[24h]) / 1073741824

  - record: minio:disk:daily_write_gb
    expr: increase(minio:disk:written_bytes_total[24h]) / 1073741824

  - record: minio:disk:daily_read_gb
    expr: increase(minio:disk:read_bytes_total[24h]) / 1073741824
