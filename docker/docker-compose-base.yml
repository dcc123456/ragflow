  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - ${RABBITMQ_AMQP_PORT}:5672
      - ${RABBITMQ_MANAGEMENT_PORT}:15672
      - ${RABBITMQ_PROMETHEUS_PORT}:15692
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./rabbitmq-conf/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-conf/definitions.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq/
    networks:
      - ragflow
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120

  tei-cpu:
    profiles:
      - tei-cpu
    image: ${TEI_IMAGE_CPU}
    hostname: tei
    ports:
      - ${TEI_PORT-6380}:80
    env_file: .env
    networks:
      - ragflow
    command: ["--model-id", "/data/${TEI_MODEL}", "--auto-truncate"]
    restart: on-failure

  tei-gpu:
    profiles:
      - tei-gpu
    image: ${TEI_IMAGE_GPU}
    hostname: tei
    ports:
      - ${TEI_PORT-6380}:80
    env_file: .env
    networks:
      - ragflow
    command: ["--model-id", "/data/${TEI_MODEL}", "--auto-truncate"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: on-failure

volumes:
  esdata01:
    driver: local
  mysql_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  kibana_data:
    driver: local
  components_exporter_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  ragflow:
    driver: bridge
