version: '2.2'

services:
  es:
    container_name: ragflow-es
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - /home/ubuntu/es_data/:/usr/share/elasticsearch/data
      - /home/ubuntu/infiniflow-ai/docker/certs:/usr/share/elasticsearch/config/certs
    network_mode: "host"
    environment:
      - node.name=es03
      - ES_JAVA_OPTS=-Xms26g -Xmx26g
      - JVM_OPTS=-Xms26g -Xmx26g
      - bootstrap.memory_lock=true
      - ELASTIC_USERNAME=${ELASTIC_USERNAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - cluster.name=${CLUSTER_NAME}
      - discovery.seed_hosts=10.142.0.5,10.142.0.4,10.142.0.3
      - cluster.initial_master_nodes=10.142.0.2,10.142.0.5,10.142.0.4,10.142.0.3
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es03/es03.key
      - xpack.security.http.ssl.certificate=certs/es03/es03.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es03/es03.key
      - xpack.security.transport.ssl.certificate=certs/es03/es03.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - cluster.max_shards_per_node=8192
      - TZ=${TIMEZONE}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: always

  mysql:
    image: mysql:8.4
    container_name: ragflow-mysql-slave
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TIMEZONE}
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --max_allowed_packet=64505856
      --collation-server=utf8mb4_general_ci
      --tls_version="TLSv1.2,TLSv1.3"
      --server-id=3  
      --log-bin=mysql-bin
      --binlog-format=row
      --port=${MYSQL_PORT}
      --slave_skip_errors=all
      --binlog_expire_logs_seconds=86400
    volumes:
      - mysql_data:/var/lib/mysql
    network_mode: "host"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: always

  minio:
    image: quay.io/minio/minio:RELEASE.2023-12-20T01-00-02Z
    container_name: ragflow-minio
    command: server --console-address ":9001"  /data
    ports:
      - ${MINIO_PORT}:9000
      - 9001:9001
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - minio_data:/data
    networks:
      - ragflow
    restart: always

  redis:
    image: redis:7.2.4
    container_name: ragflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru --port ${REDIS_PORT}
    volumes:
      - redis_data:/data
    network_mode: "host"
    restart: always

  kibana:
    depends_on:
      es:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    volumes:
      - /home/ubuntu/infiniflow-ai/docker/certs:/usr/share/kibana/config/certs
      - kibana_vol:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://10.142.0.2:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - XPACK_SECURITY_ENCRYPTIONKEY=${ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${ENCRYPTION_KEY}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120


  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq-01
    ports:
      - 1672:5672
      - 1673:15672
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ${PWD}/rabbitmq.erlang.cookie:/var/lib/rabbitmq/.erlang.cookie
      - ${PWD}/rabbitmq-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh
      - rabbitmq_data:/var/lib/rabbitmq/
    entrypoint: /usr/local/bin/cluster-entrypoint.sh
    networks:
      - ragflow


volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  ragflow:
    driver: bridge