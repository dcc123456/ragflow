  rabbitmq:
    image: rabbitmq:4-management
    hostname: ragflow-rabbitmq-01
    container_name: ragflow-rabbitmq-01
    ports:
      - 1672:5672
      - 1673:15672
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ${PWD}/rabbitmq.erlang.cookie:/var/lib/rabbitmq/.erlang.cookie
      - ${PWD}/rabbitmq-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh
      - rabbitmq_data:/var/lib/rabbitmq/
    entrypoint: /usr/local/bin/cluster-entrypoint.sh
    networks:
      - ragflow


volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  esdata01:
    driver: local
  kibana_vol:
    driver: local

networks:
  ragflow:
    driver: bridge