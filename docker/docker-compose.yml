name: docker

include:
  - ./docker-compose-base.yml

x-ragflow-environment: &ragflow-environment
  KVROCKS_HOST: kvrocks
  KVROCKS_PORT: 6379
  RAGFLOW_ADMIN_HOST: admin
  RAGFLOW_ADMIN_HTTP_PORT: 9381

x-ragflow: &ragflow
  image: ${RAGFLOW_IMAGE}
  entrypoint: ["/ragflow/entrypoint.sh"]
  profiles: [cpu]
  env_file: .env
  environment: *ragflow-environment
  volumes:
    - ./ragflow-logs:/ragflow/logs
    - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
    - ./entrypoint.sh:/ragflow/entrypoint.sh:ro
    # - ${RAGFLOW_SSH_KNOWN_HOSTS:-${HOME}/.ssh/known_hosts}:${SSH_KNOWN_HOSTS:-/etc/ragflow/ssh_known_hosts}:ro
  networks:
    - ragflow
  restart: unless-stopped
  stop_grace_period: 30s
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
    nproc:
      soft: 65535
      hard: 65535
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  migrate:
    <<: *ragflow
    command: ["--migrate"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
        required: false

  admin:
    <<: *ragflow
    command: ["--admin", "--init-superuser"]
    environment:
      <<: *ragflow-environment
    ports:
      - ${ADMIN_SVR_HTTP_PORT}:9381
    depends_on:
      migrate:
        condition: service_completed_successfully
      kvrocks:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      es01:
        condition: service_healthy
        required: false
      clickhouse:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9381/healthz"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ragflow-cpu:
    <<: *ragflow
    command: ["--api"]
    environment:
      <<: *ragflow-environment
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      # The Go API also serves POST /api/v1/mcp on 9380.
      # - ${SVR_MCP_PORT}:${RAGFLOW_MCP_PORT:-9382}
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9380/api/v1/system/healthz"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ingestor:
    <<: *ragflow
    command: ["--ingestor"]
    depends_on:
      admin:
        condition: service_healthy

  syncer:
    <<: *ragflow
    command: ["--syncer"]
    depends_on:
      admin:
        condition: service_healthy

