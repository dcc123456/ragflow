include:
  - ./docker-compose-base.yml

services:
  ragflow:
    image: infiniflow-ai/ragflow:latest
    container_name: infiniflow-ragflow-server
    network_mode: "host"
    volumes:
      - ./service_conf.yaml:/ragflow/conf/service_conf.yaml
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./res/:/ragflow/rag/res
    environment:
      - MAX_FILE_NUM_PER_USER=${MAX_FILE_NUM_PER_USER}
      - TZ=${TIMEZONE}
      - ENABLE_ADMIN=${ENABLE_ADMIN}
      # - OCR_SVR=http://10.142.0.6:12344
      # - TENSORRT_DLA_SVR=http://10.142.0.6:3344
      # - TENSORRT_TSR_SVR=http://10.142.0.6:11234
    restart: always
    env_file: .env
