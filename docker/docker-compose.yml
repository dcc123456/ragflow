include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
services:
  # DeepDoc model server (OCR, DLA, TSR) - separate from RAGFlow API/parser
  deepdoc:
    image: ${DEEPDOC_IMAGE:-infiniflow-ai/deepdoc_cpu:v0.24.0-5-mt}
    hostname: deepdoc
    networks:
      - ragflow
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 120
    environment:
      - TZ=${TZ}

  ragflow:
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
      deepdoc:
        condition: service_healthy
    image: ${RAGFLOW_IMAGE}
    environment:
      - DEEPDOC_URL=http://deepdoc:8000
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/ragflow/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
      - --init-model-provider-tables
      - --disable-datasync
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9380/api/v1/system/ping"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s
    ports:
       # Web ports 80/443 moved to standalone nginx service
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
      - ${GO_HTTP_PORT}:9384
      - ${GO_ADMIN_PORT}:9383
    volumes:
      - ./ragflow-logs:/ragflow/logs
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    env_file: .env
    networks:
      ragflow:
        aliases:
          - ragflow-api
          - admin
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Data source sync worker (standalone, mirrors byok's ragflow_data_sync resource)
  data_sync:
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
      deepdoc:
        condition: service_healthy
    image: ${RAGFLOW_IMAGE}
    command:
      - --disable-webserver
      - --disable-taskexecutor
    environment:
      - DEEPDOC_URL=http://deepdoc:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9380/api/v1/system/ping"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    env_file: .env


    networks:
      - ragflow
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"


  # Standalone nginx (mirrors byok's nginx resource)
  nginx:
    depends_on:
      ragflow:
        condition: service_healthy
    image: ${RAGFLOW_IMAGE}
    command:
      - --nginx-only
    environment:
      - API_PROXY_SCHEME=python
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
    volumes:
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    env_file: .env
    networks:
      - ragflow
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 10s
      retries: 120

  parser:
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
      deepdoc:
        condition: service_healthy
    image: ${RAGFLOW_IMAGE}
    entrypoint: /ragflow/entrypoint-parser.sh
    environment:
      - DEEPDOC_URL=http://deepdoc:8000
    volumes:
      - ./ragflow-logs:/ragflow/logs
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint-parser.sh:/ragflow/entrypoint-parser.sh
    env_file: .env
    networks:
      - ragflow
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
