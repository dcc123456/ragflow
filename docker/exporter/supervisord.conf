[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:mysql]
command=/bin/sh -c 'exec /usr/local/bin/mysqld_exporter --config.my-cnf= --mysqld.address="$MYSQL_EXPORTER_ADDRESS" --mysqld.username="$MYSQL_EXPORTER_USER" --web.listen-address=":$MYSQL_EXPORTER_PORT"'
autostart=%(ENV_MYSQL_EXPORTER_ENABLED)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:kvrocks]
command=/bin/sh -c 'exec /usr/local/bin/kvrocks_exporter --connection-timeout=3s --web.listen-address=":$KVROCKS_EXPORTER_PORT"'
autostart=%(ENV_KVROCKS_EXPORTER_ENABLED)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nats]
command=/bin/sh -c 'exec /usr/local/bin/prometheus-nats-exporter -port "$NATS_EXPORTER_PORT" -prefix nats -varz -healthz -jsz=all "$NATS_MONITORING_URL"'
autostart=%(ENV_NATS_EXPORTER_ENABLED)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:elasticsearch]
command=/bin/sh -c 'exec /usr/local/bin/elasticsearch_exporter --es.uri="$ES_URI" --es.all --web.listen-address=":$ES_EXPORTER_PORT"'
autostart=%(ENV_ES_EXPORTER_ENABLED)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
