worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

# Expose specific environment variables to Nginx workers so Lua can read them.
# NOTE: Only the listed variables are inherited by worker processes; all others
# are stripped by nginx.  The init_by_lua_block below snapshots these values
# into ngx.shared.dict so workers can access them reliably.
env RATELIMIT_REDIS_HOST;
env RATELIMIT_REDIS_PORT;
env RATELIMIT_REDIS_PASSWORD;
env RATELIMIT_REDIS_DB;
env RATELIMIT_DISABLED;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_PASSWORD;
env REDIS_DB;

events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'tenant=$http_x_billing_tenant_id';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;
    client_max_body_size 1024M;

    # Shared dict for in-process caching (tenant lookup, rate-limit configs)
    lua_shared_dict billing_cache 4m;

    # Lua package path for rate limiting module
    lua_package_path "/etc/nginx/?.lua;;";

    # init_by_lua runs in the master process where os.getenv() can still read
    # inherited container environment variables.  We snapshot Redis config here
    # and store it in ngx.shared.dict so workers can pick it up.
    init_by_lua_block {
        local cache = ngx.shared.billing_cache
        if cache then
            local function store(key)
                local v = os.getenv(key)
                if v then cache:set("_env:" .. key, v, 0) end
            end
            store("RATELIMIT_REDIS_HOST")
            store("RATELIMIT_REDIS_PORT")
            store("RATELIMIT_REDIS_PASSWORD")
            store("RATELIMIT_REDIS_DB")
            store("RATELIMIT_DISABLED")
            -- Fallback keys
            store("REDIS_HOST")
            store("REDIS_PORT")
            store("REDIS_PASSWORD")
            store("REDIS_DB")
        end
    }

    # init_worker_by_lua runs in each worker process.
    init_worker_by_lua_block {
        local ok, rate_limit = pcall(require, "rate_limit")
        if ok then
            package.loaded.rate_limit = rate_limit
            if rate_limit.init_worker then
                rate_limit.init_worker()
            end
            ngx.log(ngx.NOTICE, "rate_limit module loaded successfully")
        else
            ngx.log(ngx.WARN, "rate_limit module not available: ", rate_limit)
            package.loaded.rate_limit = nil
        end
    }

    include /etc/nginx/conf.d/ragflow.conf;
}
