worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

# Expose environment variables to Nginx workers so Lua can read them via os.getenv
env RATELIMIT_REDIS_HOST;
env RATELIMIT_REDIS_PORT;
env RATELIMIT_REDIS_PASSWORD;
env RATELIMIT_REDIS_DB;
env RATELIMIT_DISABLED;

events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'tenant=$http_x_billing_tenant_id';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;
    client_max_body_size 1024M;

    # Shared dict for in-process caching (tenant lookup, rate-limit configs)
    lua_shared_dict billing_cache 4m;

    # Lua package path for rate limiting module
    lua_package_path "/etc/nginx/?.lua;;";

    # Init: load the rate_limit module on worker start
    init_worker_by_lua_block {
        local ok, rate_limit = pcall(require, "rate_limit")
        if ok then
            package.loaded.rate_limit = rate_limit
            ngx.log(ngx.NOTICE, "rate_limit module loaded successfully")
        else
            ngx.log(ngx.WARN, "rate_limit module not available: ", rate_limit)
            package.loaded.rate_limit = nil
        end
    }

    include /etc/nginx/conf.d/ragflow.conf;
}
