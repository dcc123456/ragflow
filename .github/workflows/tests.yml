name: tests
permissions:
  contents: read

on:
  push:
    branches:
      - 'saas'
      - 'jiukun'
      - 'saas_*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.mdx'
  # The only difference between pull_request and pull_request_target is the context in which the workflow runs:
  # — pull_request_target workflows use the workflow files from the default branch, and secrets are available.
  # — pull_request workflows use the workflow files from the pull request branch, and secrets are unavailable.
  pull_request:
    types: [ synchronize, ready_for_review ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.mdx'
  schedule:
    - cron: '0 16 * * *'  # This schedule runs every 16:00:00Z(00:00:00+08:00)

# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ragflow_tests:
    name: ragflow_tests
    # https://docs.github.com/en/actions/using-jobs/using-conditions-to-control-job-execution
    # https://github.com/orgs/community/discussions/26261
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci') }}
    runs-on: [ "self-hosted", "ragflow-test" ]
    steps:
      - name: Ensure workspace ownership
        run: |
          echo "Workflow triggered by ${{ github.event_name }}"
          echo "chown -R ${USER} ${GITHUB_WORKSPACE}" && sudo chown -R ${USER} ${GITHUB_WORKSPACE}

      # https://github.com/actions/checkout/issues/1781
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Bridge runner CI environment into workflow env
        id: bridge_ci_env
        run: |
          bridge_env_var() {
            local name="$1"
            local required="${2:-0}"
            local value="${!name:-}"
            local lower_name

            if [[ -z "${value}" ]]; then
              if [[ "${required}" == "1" ]]; then
                echo "Error: required runner environment variable ${name} is not set."
                exit 1
              fi
              return 0
            fi

            lower_name="$(echo "${name}" | tr '[:upper:]' '[:lower:]')"

            {
              echo "${name}<<__EOF__"
              echo "${value}"
              echo "__EOF__"
            } >> "${GITHUB_ENV}"

            {
              echo "${lower_name}<<__EOF__"
              echo "${value}"
              echo "__EOF__"
            } >> "${GITHUB_OUTPUT}"
          }

          bridge_env_var KUBE_CONFIG 1
          bridge_env_var BILLING_STRIPE_API_KEY
          bridge_env_var SILICONFLOW_API_KEY
          bridge_env_var SILICONFLOW_BASE_URL
          bridge_env_var SILICONFLOW_EMBEDDING_MODEL
          bridge_env_var HARBOR_USER
          bridge_env_var HARBOR_PASSWORD
          bridge_env_var MY_GH_TOKEN

      - name: Check workflow duplication
        if: ${{ !cancelled() && !failure() }}
        run: |
          if [[ ${GITHUB_EVENT_NAME} != "pull_request" && ${GITHUB_EVENT_NAME} != "schedule" ]]; then
            HEAD=$(git rev-parse HEAD)
            # Find a PR that introduced a given commit
            echo "${MY_GH_TOKEN}" | gh auth login --with-token
            PR_NUMBER=$(gh pr list --search ${HEAD} --state merged --json number --jq .[0].number)
            echo "HEAD=${HEAD}"
            echo "PR_NUMBER=${PR_NUMBER}"
            if [[ -n "${PR_NUMBER}" ]]; then
              PR_SHA_FP=${RUNNER_WORKSPACE_PREFIX}/artifacts/${GITHUB_REPOSITORY}/PR_${PR_NUMBER}
              if [[ -f "${PR_SHA_FP}" ]]; then
                read -r PR_SHA PR_RUN_ID < "${PR_SHA_FP}"
                # Calculate the hash of the current workspace content
                HEAD_SHA=$(git rev-parse HEAD^{tree})
                if [[ "${HEAD_SHA}" == "${PR_SHA}" ]]; then
                  echo "Cancel myself since the workspace content hash is the same with PR #${PR_NUMBER} merged. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${PR_RUN_ID} for details."
                  gh run cancel ${GITHUB_RUN_ID}
                  while true; do
                    status=$(gh run view ${GITHUB_RUN_ID} --json status -q .status)
                    [ "${status}" = "completed" ] && break
                    sleep 5
                  done
                  exit 1
                fi
              fi
            fi
          elif [[ ${GITHUB_EVENT_NAME} == "pull_request" ]]; then
            PR_NUMBER=${{ github.event.pull_request.number }}
            PR_SHA_FP=${RUNNER_WORKSPACE_PREFIX}/artifacts/${GITHUB_REPOSITORY}/PR_${PR_NUMBER}
            # Calculate the hash of the current workspace content
            PR_SHA=$(git rev-parse HEAD^{tree})
            echo "PR #${PR_NUMBER} workspace content hash: ${PR_SHA}"
            mkdir -p ${RUNNER_WORKSPACE_PREFIX}/artifacts/${GITHUB_REPOSITORY}
            echo "${PR_SHA} ${GITHUB_RUN_ID}" > ${PR_SHA_FP}
          fi
          ARTIFACTS_DIR=${RUNNER_WORKSPACE_PREFIX}/artifacts/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}
          echo "ARTIFACTS_DIR=${ARTIFACTS_DIR}" >> ${GITHUB_ENV}
          rm -rf ${ARTIFACTS_DIR} && mkdir -p ${ARTIFACTS_DIR}

      # https://github.com/astral-sh/ruff-action
      - name: Static check with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: ">=0.11.x"
          args: "check"

      - name: Check comments of changed Python files
        if: ${{ false }}
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' || ${{ github.event_name }} == 'pull_request_target' ]]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
              | grep -E '\.(py)$' || true)

            if [ -n "$CHANGED_FILES" ]; then
              echo "Check comments of changed Python files with check_comment_ascii.py"

              readarray -t files <<< "$CHANGED_FILES"
              HAS_ERROR=0

              for file in "${files[@]}"; do
                if [ -f "$file" ]; then
                  if python3 check_comment_ascii.py "$file"; then
                    echo "✅ $file"
                  else
                    echo "❌ $file"
                    HAS_ERROR=1
                  fi
                fi
              done

              if [ $HAS_ERROR -ne 0 ]; then
                exit 1
              fi
            else
              echo "No Python files changed"
            fi
          fi

      - name: Build ragflow go server
        run: |
          BUILDER_CONTAINER=ragflow_build_$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')
          echo "BUILDER_CONTAINER=${BUILDER_CONTAINER}" >> ${GITHUB_ENV}
          TZ=${TZ:-$(readlink -f /etc/localtime | awk -F '/zoneinfo/' '{print $2}')}
          sudo docker run --privileged -d --name ${BUILDER_CONTAINER} -e TZ=${TZ} -e UV_INDEX=https://mirrors.aliyun.com/pypi/simple -v ${PWD}:/ragflow -v ${PWD}/internal/cpp/resource:/usr/share/infinity/resource infiniflow/infinity_builder:ubuntu22_clang20
          sudo docker exec ${BUILDER_CONTAINER} bash -c "git config --global safe.directory \"*\" && cd /ragflow && ./build.sh --cpp"
          ./build.sh --go
          if [[ -n "${BUILDER_CONTAINER}" ]]; then
            sudo docker rm -f -v "${BUILDER_CONTAINER}"
          fi

      - name: Build ragflow:nightly
        run: |
          RUNNER_WORKSPACE_PREFIX=${RUNNER_WORKSPACE_PREFIX:-${HOME}}
          RAGFLOW_IMAGE=infiniflow-ai/ragflow:${GITHUB_RUN_ID}-${GITHUB_JOB}
          echo "RAGFLOW_IMAGE=${RAGFLOW_IMAGE}" >> ${GITHUB_ENV}
          sudo docker pull ubuntu:24.04
          sudo DOCKER_BUILDKIT=1 docker build --build-arg NEED_MIRROR=1 --build-arg HTTPS_PROXY=${HTTPS_PROXY} --build-arg HTTP_PROXY=${HTTP_PROXY} -f Dockerfile -t ${RAGFLOW_IMAGE} .
          if [[ ${GITHUB_EVENT_NAME} == "schedule" ]]; then
            export HTTP_API_TEST_LEVEL=p3
          else
            export HTTP_API_TEST_LEVEL=p2
          fi
          echo "HTTP_API_TEST_LEVEL=${HTTP_API_TEST_LEVEL}" >> ${GITHUB_ENV}
          echo "RAGFLOW_CONTAINER=${GITHUB_RUN_ID}-ragflow-1" >> ${GITHUB_ENV}

      - name: Run unit test
        run: |
          uv sync --python 3.13 --group test --frozen
          source .venv/bin/activate
          which pytest || echo "pytest not in PATH"
          echo "Start to run unit test"
          python3 run_tests.py -i

      - name: Prepare function test environment
        run: |
          # Copy res directory to docker directory
          RUNNER_WORKSPACE_PREFIX=${RUNNER_WORKSPACE_PREFIX:-${HOME}}
          if [ -d "${RUNNER_WORKSPACE_PREFIX}/res" ]; then
            echo "Copying ${RUNNER_WORKSPACE_PREFIX}/res to docker directory..."
            cp -r ${RUNNER_WORKSPACE_PREFIX}/res docker/
          else
            echo "Warning: ${RUNNER_WORKSPACE_PREFIX}/res directory not found"
          fi

          # Uncomment the res/deepdoc volume mount in docker-compose.yml
          sed -i 's|# - \./res/deepdoc:/ragflow/rag/res/deepdoc|- ./res/deepdoc:/ragflow/rag/res/deepdoc|g' docker/docker-compose.yml

          # Determine runner number (default to 1 if not found)
               RUNNER_NUM=$(sudo docker inspect $(hostname) --format '{{index .Config.Labels "com.docker.compose.container-number"}}' 2>/dev/null || true)
               RUNNER_NUM=${RUNNER_NUM:-1}

          # Compute port numbers using bash arithmetic
          ES_PORT=$((1200 + RUNNER_NUM * 100))
          OS_PORT=$((1201 + RUNNER_NUM * 100))
          INFINITY_THRIFT_PORT=$((23817 + RUNNER_NUM * 100))
          INFINITY_HTTP_PORT=$((23820 + RUNNER_NUM * 100))
          INFINITY_PSQL_PORT=$((5432 + RUNNER_NUM * 100))
          MYSQL_PORT=$((5455 + RUNNER_NUM * 100))
          MINIO_PORT=$((9000 + RUNNER_NUM * 100))
          MINIO_CONSOLE_PORT=$((9001 + RUNNER_NUM * 100))
          REDIS_PORT=$((6379 + RUNNER_NUM * 100))
          TEI_PORT=$((6380 + RUNNER_NUM * 100))
          KIBANA_PORT=$((6601 + RUNNER_NUM * 100))
          SVR_HTTP_PORT=$((9380 + RUNNER_NUM * 100))
          ADMIN_SVR_HTTP_PORT=$((9381 + RUNNER_NUM * 100))
          SVR_MCP_PORT=$((9382 + RUNNER_NUM * 100))
          GO_HTTP_PORT=$((9384 + RUNNER_NUM * 100))
          GO_ADMIN_PORT=$((9383 + RUNNER_NUM * 100))
          SANDBOX_EXECUTOR_MANAGER_PORT=$((9385 + RUNNER_NUM * 100))
          SVR_WEB_HTTP_PORT=$((80 + RUNNER_NUM * 100))
          SVR_WEB_HTTPS_PORT=$((443 + RUNNER_NUM * 100))
          RABBITMQ_AMQP_PORT=$((1672 + RUNNER_NUM * 100))
          RABBITMQ_MANAGEMENT_PORT=$((1673 + RUNNER_NUM * 100))
          RABBITMQ_PROMETHEUS_PORT=$((1674 + RUNNER_NUM * 100))

          # Persist computed ports into .env so docker-compose uses the correct host bindings
          echo "" >> docker/.env
          echo -e "ES_PORT=${ES_PORT}" >> docker/.env
          echo -e "OS_PORT=${OS_PORT}" >> docker/.env
          echo -e "INFINITY_THRIFT_PORT=${INFINITY_THRIFT_PORT}" >> docker/.env
          echo -e "INFINITY_HTTP_PORT=${INFINITY_HTTP_PORT}" >> docker/.env
          echo -e "INFINITY_PSQL_PORT=${INFINITY_PSQL_PORT}" >> docker/.env
          echo -e "MYSQL_PORT=${MYSQL_PORT}" >> docker/.env
          echo -e "MINIO_PORT=${MINIO_PORT}" >> docker/.env
          echo -e "MINIO_CONSOLE_PORT=${MINIO_CONSOLE_PORT}" >> docker/.env
          echo -e "REDIS_PORT=${REDIS_PORT}" >> docker/.env
          echo -e "TEI_PORT=${TEI_PORT}" >> docker/.env
          echo -e "KIBANA_PORT=${KIBANA_PORT}" >> docker/.env
          echo -e "SVR_HTTP_PORT=${SVR_HTTP_PORT}" >> docker/.env
          echo -e "ADMIN_SVR_HTTP_PORT=${ADMIN_SVR_HTTP_PORT}" >> docker/.env
          echo -e "SVR_MCP_PORT=${SVR_MCP_PORT}" >> docker/.env
          echo -e "GO_HTTP_PORT=${GO_HTTP_PORT}" >> docker/.env
          echo -e "GO_ADMIN_PORT=${GO_ADMIN_PORT}" >> docker/.env
          echo -e "SANDBOX_EXECUTOR_MANAGER_PORT=${SANDBOX_EXECUTOR_MANAGER_PORT}" >> docker/.env
          echo -e "SVR_WEB_HTTP_PORT=${SVR_WEB_HTTP_PORT}" >> docker/.env
          echo -e "SVR_WEB_HTTPS_PORT=${SVR_WEB_HTTPS_PORT}" >> docker/.env
          echo -e "RABBITMQ_AMQP_PORT=${RABBITMQ_AMQP_PORT}" >> docker/.env
          echo -e "RABBITMQ_MANAGEMENT_PORT=${RABBITMQ_MANAGEMENT_PORT}" >> docker/.env
          echo -e "RABBITMQ_PROMETHEUS_PORT=${RABBITMQ_PROMETHEUS_PORT}" >> docker/.env

          echo -e "COMPOSE_PROFILES=\${COMPOSE_PROFILES},tei-cpu" >> docker/.env
          echo -e "TEI_MODEL=BAAI/bge-small-en-v1.5" >> docker/.env
          echo -e "RAGFLOW_IMAGE=${RAGFLOW_IMAGE}" >> docker/.env
          echo -e "DEEPDOC_IMAGE=192.168.1.51/infiniflow-ai/deepdoc_cpu:latest" >> docker/.env
          echo -e "RATELIMIT_DISABLED=1" >> docker/.env
          echo -e "WS_WORKERS=1" >> docker/.env
          echo -e "RAPTOR_WORKERS=1" >> docker/.env
          echo -e "GRAPHRAG_WORKERS=0" >> docker/.env
          echo -e "RESUME_WORKERS=0" >> docker/.env
          sed -i 's/^BILLING_ENABLED=.*/BILLING_ENABLED=0/' docker/.env
          echo "HOST_ADDRESS=http://host.docker.internal:${SVR_HTTP_PORT}" >> ${GITHUB_ENV}

          # Patch entrypoint.sh for coverage
          sed -i '/"\$PY" api\/ragflow_server.py \${INIT_SUPERUSER_ARGS} &/c\   echo "Ensuring coverage is installed..."\n      "$PY" -m pip install coverage -i https://mirrors.aliyun.com/pypi/simple\n     export COVERAGE_FILE=/ragflow/logs/.coverage\n        echo "Starting ragflow_server with coverage..."\n        "$PY" -m coverage run --source=./api/apps --omit="*/tests/*,*/migrations/*" -a api/ragflow_server.py ${INIT_SUPERUSER_ARGS} &' docker/entrypoint.sh
          uv sync --python 3.13 --group test --frozen && uv pip install -e sdk/python

      - name: Start ragflow:nightly for Elasticsearch
        run: |
          sed -i 's/^DOC_ENGINE=.*$/DOC_ENGINE=elasticsearch/' docker/.env
          sudo docker compose -f docker/docker-compose.yml -p ${GITHUB_RUN_ID} down -v || true
          sudo docker ps -a --filter "label=com.docker.compose.project=${GITHUB_RUN_ID}" -q | xargs -r sudo docker rm -f
          sudo docker compose -f docker/docker-compose.yml -p ${GITHUB_RUN_ID} up -d

      - name: Run non-billing http api tests against Elasticsearch
        timeout-minutes: 30
        run: |
          # Disable billing for non-billing tests (billing tests run separately when p3)
          sed -i 's/BILLING_ENABLED=.*/BILLING_ENABLED=0/' docker/.env
          export http_proxy=""; export https_proxy=""; export no_proxy=""; export HTTP_PROXY=""; export HTTPS_PROXY=""; export NO_PROXY=""
          MAX_RETRIES=180
          COUNT=0
          until curl -s --connect-timeout 5 ${HOST_ADDRESS} > /dev/null; do
            echo "Waiting for service at ${HOST_ADDRESS} to be available... (Attempt: $COUNT/$MAX_RETRIES)"
            if [ $((COUNT % 5)) -eq 0 ]; then
              echo "Current Container Status:"
              sudo docker ps -a --filter "name=${RAGFLOW_CONTAINER}"
            fi

            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Error: Service did not become available within 5 minutes."
              sudo docker logs ${RAGFLOW_CONTAINER} --tail 200
              exit 1
            fi

            COUNT=$((COUNT + 1))
            sleep 5
          done
          source .venv/bin/activate && set -o pipefail; pytest -s --tb=short --level=${HTTP_API_TEST_LEVEL} \
            test/testcases/test_http_api \
            --ignore=test/testcases/test_http_api/test_billing \
                        2>&1 | tee es_http_api_test.log

      - name: RAGFlow CLI retrieval test Elasticsearch
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          source .venv/bin/activate

          export http_proxy=""; export https_proxy=""; export no_proxy=""; export HTTP_PROXY=""; export HTTPS_PROXY=""; export NO_PROXY=""

          EMAIL="ci-${GITHUB_RUN_ID}@example.com"
          PASS="ci-pass-${GITHUB_RUN_ID}"
          DATASET="ci_dataset_${GITHUB_RUN_ID}"

          CLI="python admin/client/ragflow_cli.py"

          LOG_FILE="es_cli_test.log"
          : > "${LOG_FILE}"

          ERROR_RE='Traceback|ModuleNotFoundError|ImportError|Parse error|Bad response|Fail to|code:\\s*[1-9]'
          run_cli() {
            local logfile="$1"
            shift
            local allow_re=""
            if [[ "${1:-}" == "--allow" ]]; then
              allow_re="$2"
              shift 2
            fi
            local cmd_display="$*"
            echo "===== $(date -u +\"%Y-%m-%dT%H:%M:%SZ\") CMD: ${cmd_display} =====" | tee -a "${logfile}"
            local tmp_log
            tmp_log="$(mktemp)"
            set +e
            timeout 500s "$@" 2>&1 | tee "${tmp_log}"
            local status=${PIPESTATUS[0]}
            set -e
            cat "${tmp_log}" >> "${logfile}"
            if grep -qiE "${ERROR_RE}" "${tmp_log}"; then
              if [[ -n "${allow_re}" ]] && grep -qiE "${allow_re}" "${tmp_log}"; then
                echo "Allowed CLI error markers in ${logfile}"
                rm -f "${tmp_log}"
                return 0
              fi
              echo "Detected CLI error markers in ${logfile}"
              rm -f "${tmp_log}"
              exit 1
            fi
            rm -f "${tmp_log}"
            return ${status}
          }

          set -a
          source docker/.env
          set +a

          HOST_ADDRESS="http://host.docker.internal:${SVR_HTTP_PORT}"
          USER_HOST="$(echo "${HOST_ADDRESS}" | sed -E 's#^https?://([^:/]+).*#\1#')"
          USER_PORT="${SVR_HTTP_PORT}"
          ADMIN_HOST="${USER_HOST}"
          ADMIN_PORT="${ADMIN_SVR_HTTP_PORT}"

          run_cli "${LOG_FILE}" $CLI --type admin --host "$ADMIN_HOST" --port "$ADMIN_PORT" --username "admin@ragflow.io" --password "admin" command "show version"
          ALLOW_USER_EXISTS_RE='already exists|already exist|duplicate|already.*registered|exist(s)?'
          run_cli "${LOG_FILE}" --allow "${ALLOW_USER_EXISTS_RE}" $CLI --type admin --host "$ADMIN_HOST" --port "$ADMIN_PORT" --username "admin@ragflow.io" --password "admin" command "create user '$EMAIL' '$PASS'"

          user_ready=0
          for i in $(seq 1 30); do
            if run_cli "${LOG_FILE}" $CLI --type user --host "$USER_HOST" --port "$USER_PORT" --username "$EMAIL" --password "$PASS" command "ping"; then
              user_ready=1
              break
            fi
            sleep 1
          done
          if [[ "${user_ready}" -ne 1 ]]; then
            echo "User service did not become ready"
            exit 1
          fi

          run_cli "${LOG_FILE}" $CLI --type user --host "$USER_HOST" --port "$USER_PORT" --username "$EMAIL" --password "$PASS" command "show version"
          run_cli "${LOG_FILE}" $CLI --type user --host "$USER_HOST" --port "$USER_PORT" --username "$EMAIL" --password "$PASS" command "create dataset '$DATASET' with embedding 'BAAI/bge-small-en-v1.5@Builtin' parser 'auto'"
          run_cli "${LOG_FILE}" $CLI --type user --host "$USER_HOST" --port "$USER_PORT" --username "$EMAIL" --password "$PASS" command "import 'test/benchmark/test_docs/Doc1.pdf,test/benchmark/test_docs/Doc2.pdf' into dataset '$DATASET'"
          run_cli "${LOG_FILE}" $CLI --type user --host "$USER_HOST" --port "$USER_PORT" --username "$EMAIL" --password "$PASS" command "parse dataset '$DATASET' sync"
          run_cli "${LOG_FILE}" $CLI --type user --host "$USER_HOST" --port "$USER_PORT" --username "$EMAIL" --password "$PASS" command "Benchmark 16 100 search 'what are these documents about' on datasets '$DATASET'"

      - name: Collect ragflow log Elasticsearch
        if: ${{ always() }}
        run: |
          if [ -d docker/ragflow-logs ]; then
            cp -r docker/ragflow-logs ${ARTIFACTS_DIR}/ragflow-logs
            echo "ragflow log" && tail -n 200 docker/ragflow-logs/ragflow_server.log || true
          else
            echo "No docker/ragflow-logs directory found; skipping log collection"
          fi
          sudo rm -rf docker/ragflow-logs || true

      - name: Enable billing for dedicated HTTP API billing tests
        if: ${{ env.HTTP_API_TEST_LEVEL == 'p3' }}
        run: |
          sed -i 's/^BILLING_ENABLED=.*/BILLING_ENABLED=1/' docker/.env
          sudo docker compose -f docker/docker-compose.yml -p ${GITHUB_RUN_ID} up -d --force-recreate ragflow parser

      - name: Start Stripe CLI webhook forwarding for Elasticsearch billing tests
        if: ${{ env.HTTP_API_TEST_LEVEL == 'p3' }}
        env:
          STRIPE_API_KEY: ${{ env.BILLING_STRIPE_API_KEY }}
        run: |
          if [[ -z "${STRIPE_API_KEY:-}" ]]; then
            echo "Error: missing BILLING_STRIPE_API_KEY secret for billing P3 tests."
            exit 1
          fi
          if ! command -v stripe >/dev/null 2>&1; then
            echo "Error: stripe CLI is required on the runner for billing P3 tests."
            exit 1
          fi
          stripe listen \
            --api-key "${STRIPE_API_KEY}" \
            --forward-to "${HOST_ADDRESS}/v1/billing/webhooks/stripe" \
            > stripe_listen.log 2>&1 &
          echo $! > stripe_listen.pid
          sleep 5
          if ! kill -0 "$(cat stripe_listen.pid)" 2>/dev/null; then
            echo "Error: stripe listen failed to stay running."
            cat stripe_listen.log || true
            exit 1
          fi

      - name: Run billing http api tests against Elasticsearch
        if: ${{ env.HTTP_API_TEST_LEVEL == 'p3' }}
        timeout-minutes: 30
        run: |
          export http_proxy=""; export https_proxy=""; export no_proxy=""; export HTTP_PROXY=""; export HTTPS_PROXY=""; export NO_PROXY=""
          MAX_RETRIES=180
          COUNT=0
          until curl -s --connect-timeout 5 ${HOST_ADDRESS}/v1/system/ping > /dev/null; do
            echo "Waiting for billing-enabled service at ${HOST_ADDRESS} to be available... (Attempt: $COUNT/$MAX_RETRIES)"
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Error: Billing-enabled service did not become available within 5 minutes."
              sudo docker logs ${RAGFLOW_CONTAINER} --tail 200
              exit 1
            fi
            COUNT=$((COUNT + 1))
            sleep 5
          done
          source .venv/bin/activate && set -o pipefail; pytest -s --tb=short -m billing \
            test/testcases/test_http_api/test_billing \
            2>&1 | tee es_http_api_billing_test.log

      - name: Collect ragflow log Elasticsearch
        if: ${{ always() }}
        run: |
          if [ -d docker/ragflow-logs ]; then
            cp -r docker/ragflow-logs ${ARTIFACTS_DIR}/ragflow-logs-billing
            echo "ragflow log" && tail -n 200 docker/ragflow-logs/ragflow_server.log || true
          else
            echo "No docker/ragflow-logs directory found; skipping log collection"
          fi
          if [[ -f stripe_listen.log ]]; then
            cp stripe_listen.log ${ARTIFACTS_DIR}/stripe-listen.log
            tail -n 200 stripe_listen.log || true
          fi
          sudo rm -rf docker/ragflow-logs || true

      - name: Stop Stripe CLI webhook forwarding for Elasticsearch billing tests
        if: always()
        run: |
          if [[ -f stripe_listen.pid ]]; then
            kill "$(cat stripe_listen.pid)" 2>/dev/null || true
            rm -f stripe_listen.pid
          fi

      - name: Stop ragflow:nightly for Elasticsearch
        if: always()  # always run this step even if previous steps failed
        run: |
          # Sometimes `docker compose down` fail due to hang container, heavy load etc. Need to remove such containers to release resources(for example, listen ports).
          sudo docker compose -f docker/docker-compose.yml -p ${GITHUB_RUN_ID} down -v || true
          sudo docker ps -a --filter "label=com.docker.compose.project=${GITHUB_RUN_ID}" -q | xargs -r sudo docker rm -f
          if [[ -n ${RAGFLOW_IMAGE} ]]; then
            sudo docker rmi -f ${RAGFLOW_IMAGE}
          fi

  ragflow_tests_byok:
    name: ragflow_tests_byok
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci') }}
    runs-on: [ "self-hosted", "ragflow-test-k8s" ]
    steps:
      - name: Ensure workspace ownership
        run: |
          echo "Workflow triggered by ${{ github.event_name }}"
          echo "chown -R ${USER} ${GITHUB_WORKSPACE}" && sudo chown -R ${USER} ${GITHUB_WORKSPACE}

      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Bridge runner CI environment into workflow env
        id: bridge_ci_env
        run: |
          bridge_env_var() {
            local name="$1"
            local required="${2:-0}"
            local value="${!name:-}"
            local lower_name

            if [[ -z "${value}" ]]; then
              if [[ "${required}" == "1" ]]; then
                echo "Error: required runner environment variable ${name} is not set."
                exit 1
              fi
              return 0
            fi

            lower_name="$(echo "${name}" | tr '[:upper:]' '[:lower:]')"

            {
              echo "${name}<<__EOF__"
              echo "${value}"
              echo "__EOF__"
            } >> "${GITHUB_ENV}"

            {
              echo "${lower_name}<<__EOF__"
              echo "${value}"
              echo "__EOF__"
            } >> "${GITHUB_OUTPUT}"
          }

          bridge_env_var KUBE_CONFIG 1
          bridge_env_var BILLING_STRIPE_API_KEY
          bridge_env_var SILICONFLOW_API_KEY
          bridge_env_var SILICONFLOW_BASE_URL
          bridge_env_var SILICONFLOW_EMBEDDING_MODEL
          bridge_env_var HARBOR_USER
          bridge_env_var HARBOR_PASSWORD
          bridge_env_var MY_GH_TOKEN

      - name: Check workflow duplication
        if: ${{ !cancelled() && !failure() }}
        run: |
          if [[ ${GITHUB_EVENT_NAME} != "pull_request" && ${GITHUB_EVENT_NAME} != "schedule" ]]; then
            HEAD=$(git rev-parse HEAD)
            echo "${MY_GH_TOKEN}" | gh auth login --with-token
            PR_NUMBER=$(gh pr list --search ${HEAD} --state merged --json number --jq .[0].number)
            echo "HEAD=${HEAD}"
            echo "PR_NUMBER=${PR_NUMBER}"
            if [[ -n "${PR_NUMBER}" ]]; then
              PR_SHA_FP=${RUNNER_WORKSPACE_PREFIX}/artifacts/${GITHUB_REPOSITORY}/PR_${PR_NUMBER}
              if [[ -f "${PR_SHA_FP}" ]]; then
                read -r PR_SHA PR_RUN_ID < "${PR_SHA_FP}"
                HEAD_SHA=$(git rev-parse HEAD^{tree})
                if [[ "${HEAD_SHA}" == "${PR_SHA}" ]]; then
                  echo "Cancel myself since the workspace content hash is the same with PR #${PR_NUMBER} merged. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${PR_RUN_ID} for details."
                  gh run cancel ${GITHUB_RUN_ID}
                  while true; do
                    status=$(gh run view ${GITHUB_RUN_ID} --json status -q .status)
                    [ "${status}" = "completed" ] && break
                    sleep 5
                  done
                  exit 1
                fi
              fi
            fi
          elif [[ ${GITHUB_EVENT_NAME} == "pull_request" ]]; then
            PR_NUMBER=${{ github.event.pull_request.number }}
            PR_SHA_FP=${RUNNER_WORKSPACE_PREFIX}/artifacts/${GITHUB_REPOSITORY}/PR_${PR_NUMBER}
            PR_SHA=$(git rev-parse HEAD^{tree})
            echo "PR #${PR_NUMBER} workspace content hash: ${PR_SHA}"
            mkdir -p ${RUNNER_WORKSPACE_PREFIX}/artifacts/${GITHUB_REPOSITORY}
            echo "${PR_SHA} ${GITHUB_RUN_ID}" > ${PR_SHA_FP}
          fi
          ARTIFACTS_DIR=${RUNNER_WORKSPACE_PREFIX}/artifacts/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}
          echo "ARTIFACTS_DIR=${ARTIFACTS_DIR}" >> ${GITHUB_ENV}
          rm -rf ${ARTIFACTS_DIR} && mkdir -p ${ARTIFACTS_DIR}

      - name: Set CI-scoped BYOK identifiers
        run: |
          BYOK_NAMESPACE="ragflow-${GITHUB_RUN_ID}"
          PRIVATE_RAGFLOW_TAG="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PRIVATE_RAGFLOW_IMAGE="192.168.1.51/infiniflow-ai/ragflow:${PRIVATE_RAGFLOW_TAG}"
          BYOK_RAGFLOW_IMAGE_VAR="ragflow:${PRIVATE_RAGFLOW_TAG}"
          echo "BYOK_NAMESPACE=${BYOK_NAMESPACE}" >> "${GITHUB_ENV}"
          echo "PRIVATE_RAGFLOW_TAG=${PRIVATE_RAGFLOW_TAG}" >> "${GITHUB_ENV}"
          echo "PRIVATE_RAGFLOW_IMAGE=${PRIVATE_RAGFLOW_IMAGE}" >> "${GITHUB_ENV}"
          echo "BYOK_RAGFLOW_IMAGE_VAR=${BYOK_RAGFLOW_IMAGE_VAR}" >> "${GITHUB_ENV}"

      - name: Static check with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: ">=0.11.x"
          args: "check"

      - name: Check comments of changed Python files
        if: ${{ false }}
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' || ${{ github.event_name }} == 'pull_request_target' ]]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
              | grep -E '\.(py)$' || true)

            if [ -n "$CHANGED_FILES" ]; then
              echo "Check comments of changed Python files with check_comment_ascii.py"

              readarray -t files <<< "$CHANGED_FILES"
              HAS_ERROR=0

              for file in "${files[@]}"; do
                if [ -f "$file" ]; then
                  if python3 check_comment_ascii.py "$file"; then
                    echo "✅ $file"
                  else
                    echo "❌ $file"
                    HAS_ERROR=1
                  fi
                fi
              done

              if [ $HAS_ERROR -ne 0 ]; then
                exit 1
              fi
            else
              echo "No Python files changed"
            fi
          fi

      - name: Build ragflow go server
        run: |
          BUILDER_CONTAINER=ragflow_build_$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')
          echo "BUILDER_CONTAINER=${BUILDER_CONTAINER}" >> ${GITHUB_ENV}
          TZ=${TZ:-$(readlink -f /etc/localtime | awk -F '/zoneinfo/' '{print $2}')}
          sudo docker run --privileged -d --name ${BUILDER_CONTAINER} -e TZ=${TZ} -e UV_INDEX=https://mirrors.aliyun.com/pypi/simple -v ${PWD}:/ragflow -v ${PWD}/internal/cpp/resource:/usr/share/infinity/resource infiniflow/infinity_builder:ubuntu22_clang20
          sudo docker exec ${BUILDER_CONTAINER} bash -c "git config --global safe.directory \"*\" && cd /ragflow && ./build.sh --cpp"
          ./build.sh --go
          if [[ -n "${BUILDER_CONTAINER}" ]]; then
            sudo docker rm -f -v "${BUILDER_CONTAINER}"
          fi

      - name: Build ragflow:nightly
        run: |
          RUNNER_WORKSPACE_PREFIX=${RUNNER_WORKSPACE_PREFIX:-${HOME}}
          RAGFLOW_IMAGE=infiniflow-ai/ragflow:${GITHUB_RUN_ID}-${GITHUB_JOB}
          echo "RAGFLOW_IMAGE=${RAGFLOW_IMAGE}" >> ${GITHUB_ENV}
          sudo docker pull ubuntu:24.04
          sudo DOCKER_BUILDKIT=1 docker build --build-arg NEED_MIRROR=1 --build-arg HTTPS_PROXY=${HTTPS_PROXY} --build-arg HTTP_PROXY=${HTTP_PROXY} -f Dockerfile -t ${RAGFLOW_IMAGE} .
          if [[ ${GITHUB_EVENT_NAME} == "schedule" ]]; then
            export HTTP_API_TEST_LEVEL=p3
          else
            export HTTP_API_TEST_LEVEL=p2
          fi
          echo "HTTP_API_TEST_LEVEL=${HTTP_API_TEST_LEVEL}" >> ${GITHUB_ENV}

      - name: Run unit test
        run: |
          uv sync --python 3.13 --group test --frozen
          source .venv/bin/activate
          which pytest || echo "pytest not in PATH"
          echo "Start to run unit test"
          python3 run_tests.py

      - name: Prepare http api test environment
        run: |
          uv sync --python 3.13 --group test --frozen && uv pip install -e sdk/python

      - name: Verify Cluster
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Export kubeconfig path for OpenTofu
        run: |
          if [[ -z "${KUBECONFIG:-}" ]]; then
            echo "Error: KUBECONFIG is empty on the runner."
            exit 1
          fi
          echo "TF_VAR_kubeconfig_path=${KUBECONFIG}" >> "${GITHUB_ENV}"

      - name: Tag and push image to Harbor
        run: |
          echo "${HARBOR_PASSWORD}" | sudo docker login 192.168.1.51 -u "${HARBOR_USER}" --password-stdin
          sudo docker tag ${RAGFLOW_IMAGE} ${PRIVATE_RAGFLOW_IMAGE}

          PUSH_LOG=$(mktemp)
          set -o pipefail
          sudo docker push ${PRIVATE_RAGFLOW_IMAGE} 2>&1 | tee "${PUSH_LOG}"

          PRIVATE_RAGFLOW_DIGEST=$(sudo docker inspect --format='{{index .RepoDigests 0}}' ${PRIVATE_RAGFLOW_IMAGE} 2>/dev/null | sed -nE 's#.*@(sha256:[0-9a-f]{64})#\1#p' | head -n 1)
          if [[ -z "${PRIVATE_RAGFLOW_DIGEST}" ]]; then
            PRIVATE_RAGFLOW_DIGEST=$(grep -Eo 'digest: sha256:[0-9a-f]{64}' "${PUSH_LOG}" | tail -n 1 | awk '{print $2}')
          fi
          rm -f "${PUSH_LOG}"

          if [[ -z "${PRIVATE_RAGFLOW_DIGEST}" ]]; then
            echo "Error: failed to capture pushed artifact digest."
            exit 1
          fi
          echo "PRIVATE_RAGFLOW_DIGEST=${PRIVATE_RAGFLOW_DIGEST}" >> ${GITHUB_ENV}

      - name: Ensure OpenTofu is available
        run: |
          if command -v tofu >/dev/null 2>&1; then
            tofu version
            exit 0
          fi
          sudo docker pull ghcr.io/opentofu/opentofu:minimal
          TOFU_CID=$(sudo docker create ghcr.io/opentofu/opentofu:minimal)
          sudo docker cp ${TOFU_CID}:/usr/local/bin/tofu /tmp/tofu
          sudo docker rm -f ${TOFU_CID}
          sudo install -m 0755 /tmp/tofu /usr/local/bin/tofu
          rm -f /tmp/tofu
          tofu version

      - name: Deploy BYOK with OpenTofu
        working-directory: opentofu_ragflow/byok
        run: |
          tofu init
  
          mapfile -t USED_DBS < <(
            kubectl get secrets -A -o json |
              jq -r '
                .items[]
                | select(.metadata.name == "ragflow-env")
                | ((.data.REDIS_DB // "") | @base64d)
                | select(test("^[0-9]+$"))
              ' |
              sort -nu
          )
  
          BYOK_REDIS_DB=""
          for db in $(seq 0 15); do
            [[ "${db}" == "1" ]] && continue
            if ! printf '%s\n' "${USED_DBS[@]}" | grep -qx "${db}"; then
              BYOK_REDIS_DB="${db}"
              break
            fi
          done
  
          if [[ -z "${BYOK_REDIS_DB}" ]]; then
            echo "Error: no free Redis DB available in 0..15 (excluding 1)."
            exit 1
          fi
          echo "BYOK_REDIS_DB=${BYOK_REDIS_DB}" >> "${GITHUB_ENV}"
  
          ns_secret_json="$(kubectl get secret ragflow-env -n "${BYOK_NAMESPACE}" -o json --ignore-not-found)"
          if [[ -n "${ns_secret_json}" ]]; then
            ns_redis_db="$(jq -r '(.data.REDIS_DB // "") | @base64d' <<<"${ns_secret_json}")"
            if [[ "${ns_redis_db}" =~ ^[0-9]+$ ]]; then
              echo "Error: namespace ${BYOK_NAMESPACE} already has ragflow-env with REDIS_DB=${ns_redis_db}."
              exit 1
            fi
            echo "Error: namespace ${BYOK_NAMESPACE} already has ragflow-env secret."
            exit 1
          fi
  
          tofu plan -var-file=terraform.tfvars.dev_smk \
            -var "namespace=${BYOK_NAMESPACE}" \
            -var "redis_db=${BYOK_REDIS_DB}" \
            -var "ragflow_image=${BYOK_RAGFLOW_IMAGE_VAR}" \
            -var "rate_limit_disabled=true" 
  
          tofu apply -auto-approve -var-file=terraform.tfvars.dev_smk \
            -var "namespace=${BYOK_NAMESPACE}" \
            -var "redis_db=${BYOK_REDIS_DB}" \
            -var "ragflow_image=${BYOK_RAGFLOW_IMAGE_VAR}" \
            -var "rate_limit_disabled=true"
  
          GATEWAY_ADDRESS="$(kubectl get gateway ragflow -n "${BYOK_NAMESPACE}" -o jsonpath='{.status.addresses[0].value}' 2>/dev/null | tr -d '[:space:]')"
          if [[ -z "${GATEWAY_ADDRESS}" ]]; then
            echo "Error: gateway_address output is empty."
            exit 1
          fi
          echo "HOST_ADDRESS=http://${GATEWAY_ADDRESS}" >> "${GITHUB_ENV}"

      - name: Run non-billing http api tests against Elasticsearch
        timeout-minutes: 30
        env:
          K8S_CI_USE_SILICONFLOW: "1"
          SILICONFLOW_API_KEY: ${{ env.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: ${{ vars.SILICONFLOW_BASE_URL }}
          SILICONFLOW_EMBEDDING_MODEL: ${{ vars.SILICONFLOW_EMBEDDING_MODEL }}
          BILLING_ENABLED: "0"
        run: |
          # Billing tests currently disabled on k8s (BILLING_ENABLED=0)
          export http_proxy=""; export https_proxy=""; export no_proxy=""; export HTTP_PROXY=""; export HTTPS_PROXY=""; export NO_PROXY=""
          if [[ -z "${SILICONFLOW_API_KEY:-}" ]]; then
            echo "Error: missing SILICONFLOW_API_KEY secret for k8s CI embedding setup."
            exit 1
          fi
          export SILICONFLOW_BASE_URL="${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}"
          export SILICONFLOW_EMBEDDING_MODEL="${SILICONFLOW_EMBEDDING_MODEL:-BAAI/bge-m3}"
          MAX_RETRIES=180
          COUNT=0
          until curl -sf --connect-timeout 5 ${HOST_ADDRESS}/api/v1/system/ping > /dev/null; do
            echo "Waiting for service at ${HOST_ADDRESS} to be available... (Attempt: $COUNT/$MAX_RETRIES)"
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Error: Service did not become available within 5 minutes."
              exit 1
            fi

            COUNT=$((COUNT + 1))
            sleep 5
          done
          source .venv/bin/activate && set -o pipefail; pytest -s --tb=short --level=${HTTP_API_TEST_LEVEL} \
            test/testcases/test_http_api \
            --ignore=test/testcases/test_http_api/test_billing 2>&1 | tee k8s_restful_api_test.log

      - name: Tail BYOK ragflow pod logs
        if: always()
        run: |
          if [[ -z "${BYOK_NAMESPACE:-}" ]]; then
            echo "BYOK_NAMESPACE is empty; skipping pod log tail."
            exit 0
          fi

          POD_NAME="$(kubectl get pods -n "${BYOK_NAMESPACE}" -l app=ragflow --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)"
          if [[ -z "${POD_NAME}" ]]; then
            POD_NAME="$(kubectl get pods -n "${BYOK_NAMESPACE}" -l app=ragflow -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)"
          fi

          if [[ -z "${POD_NAME}" ]]; then
            echo "No BYOK ragflow pod found in namespace ${BYOK_NAMESPACE}; skipping pod log tail."
            exit 0
          fi

          echo "Tailing last 1000 lines from pod ${POD_NAME} (namespace: ${BYOK_NAMESPACE}, container: ragflow)"
          kubectl logs -n "${BYOK_NAMESPACE}" "${POD_NAME}" -c ragflow --tail=1000 || true

      - name: Destroy BYOK instance
        if: always()
        working-directory: opentofu_ragflow/byok
        run: |
          tofu init
  
          if [[ -z "${BYOK_REDIS_DB:-}" ]]; then
            ns_secret_json="$(kubectl get secret ragflow-env -n "${BYOK_NAMESPACE}" -o json --ignore-not-found)"
            if [[ -n "${ns_secret_json}" ]]; then
              ns_redis_db="$(jq -r '(.data.REDIS_DB // "") | @base64d' <<<"${ns_secret_json}")"
              if [[ "${ns_redis_db}" =~ ^[0-9]+$ ]]; then
                BYOK_REDIS_DB="${ns_redis_db}"
              fi
            fi
          fi
  
          if [[ -z "${BYOK_REDIS_DB:-}" ]]; then
            echo "Skip destroy because BYOK_REDIS_DB could not be determined."
            exit 0
          fi
  
          tofu destroy -auto-approve -var-file=terraform.tfvars.dev_smk \
            -var "namespace=${BYOK_NAMESPACE}" \
            -var "redis_db=${BYOK_REDIS_DB}" \
            -var "ragflow_image=${BYOK_RAGFLOW_IMAGE_VAR}" \
            -var "rate_limit_disabled=true" \

      - name: Delete Harbor artifact
        if: always()
        run: |
          if [[ -z "${PRIVATE_RAGFLOW_DIGEST:-}" ]]; then
            echo "Skip Harbor cleanup because PRIVATE_RAGFLOW_DIGEST is empty."
            exit 0
          fi

          if [[ -z "${HARBOR_USER:-}" || -z "${HARBOR_PASSWORD:-}" ]]; then
            echo "Skip Harbor cleanup because HARBOR_USER or HARBOR_PASSWORD is empty."
            exit 0
          fi

          DIGEST_REFERENCE=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["PRIVATE_RAGFLOW_DIGEST"], safe=""))')

          curl --fail --silent --show-error \
            --user "${HARBOR_USER}:${HARBOR_PASSWORD}" \
            --request DELETE \
            "http://192.168.1.51/api/v2.0/projects/infiniflow-ai/repositories/ragflow/artifacts/${DIGEST_REFERENCE}"

      - name: Remove local Docker images
        if: always()
        run: |
          if [[ -n "${PRIVATE_RAGFLOW_IMAGE:-}" ]]; then
            sudo docker rmi -f "${PRIVATE_RAGFLOW_IMAGE}" || true
          fi
          if [[ -n "${RAGFLOW_IMAGE:-}" ]]; then
            sudo docker rmi -f "${RAGFLOW_IMAGE}" || true
          fi
