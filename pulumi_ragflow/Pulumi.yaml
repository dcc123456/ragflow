name: pulumi_ragflow
runtime:
  name: go
description: Pulumi component for RAGFlow in Go on Kubernetes
config:
  pulumi_ragflow:cloud:
    type: string
    default: existing
    description: 'Cloud provider: aliyun (Alibaba Cloud), gcp, or existing'
  pulumi_ragflow:namespace:
    type: string
    default: ragflow
    description: Kubernetes namespace for RAGFlow deployment
  pulumi_ragflow:ragflow_gateway:
    type: string
    default: ragflow.local
    description: Gateway hostname for RAGFlow
  pulumi_ragflow:ragflow_image:
    type: string
    default: infiniflow-ai/ragflow:nightly
    description: Docker image for RAGFlow
  pulumi_ragflow:es_replicas:
    type: integer
    default: 3
    description: Elasticsearch replicas count
  pulumi_ragflow:es_storage:
    type: string
    default: 100Gi
    description: Elasticsearch storage size
  pulumi_ragflow:es_memory_request:
    type: string
    default: 40Gi
    description: Elasticsearch container memory request (other resources derived from this)
