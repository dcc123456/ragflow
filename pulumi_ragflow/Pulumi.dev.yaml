config:
  # Cloud provider: "aliyun" (Alibaba Cloud) | "gcp" | "existing"
  # Default: "onpremise" - use existing self-managed Kubernetes cluster
  cloud: onpremise

  kubernetes.namespace: ragflow
  kubernetes.storage_class: rook-ceph-block
  kubernetes.use_public_registry: "true"
  kubernetes.enterprise_registry: 192.168.1.51

  ragflow.replicas: "1"
  ragflow.image_tag: latest
  parser.replicas: "1"

  # Unified DeepDoc service (DLA + OCR + TSR)
  deepdoc.replicas: "1"
  deepdoc.hardware: cpu
  # deepdoc.vram_mb: "10240"
  # deepdoc.vcore: "100"

  elasticsearch.version: "8.11.3"
  elasticsearch.node_amount: "1"
  elasticsearch.disk_size: 2

  s3.bucket: ragflow
  s3.region: us-east-1
  s3.endpoint: http://rook-ceph-rgw-my-store.rook-ceph.svc:80
  s3.access_key:
    secure: v1:M5N4+NgTxUkjAg53:jRHLu8H8XPNEEawn6G5ZY432tLbkLEH7yCLlP3nw7Acx++Fn
  s3.secret_key:
