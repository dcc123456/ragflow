# Pulumi configuration for Kubernetes resources deployment (ali_k8s stack - phase 2)
# This stack deploys Kubernetes resources using kubeconfig from the 'ali' stack
encryptionsalt: v1:myAJp/oJXzI=:v1:xy+0QsfgBsPr17kl:Tz7Z3QpKyLMp83KHtKXu5YWudx7T8g==
config:
  cloud: aliyun
  phase: k8s

  kubernetes.namespace: ragflow
  # Kubernetes StorageClass for PVCs (REQUIRED)
  # - All PVCs (MySQL, Elasticsearch, RabbitMQ) depend on this
  # - Must match your cluster's available StorageClass
  # - Run: kubectl get storageclass to see available options
  # Common values:
  #   - ACK/ASK (Aliyun): alicloud-disk-alltype
  #   - Rook/Ceph: rook-ceph-block
  #   - Local path: local-path
  #   - ACS (Aliyun): alicloud-disk-topology-alltype
  kubernetes.storage_class: alicloud-disk-alltype
  kubernetes.use_public_registry: "false"
  kubernetes.enterprise_registry: infiniflow-registry.cn-shanghai.cr.aliyuncs.com
  kubernetes.enterprise_registry_username: infiniflow
  kubernetes.enterprise_registry_password:
    secure: v1:/KzZhHPazzH2PnND:kXOTD6T91ebuSdZVIXZ9Kno1piTb8sXIqfpycU0=

  s3.bucket: ragflow-yuzhichang-prod
  s3.region: cn-shanghai
  s3.endpoint: http://oss-cn-shanghai-internal.aliyuncs.com
  s3.access_key:
    secure: v1:n3A/lz1UsY1ti5dW:zKR4L9s7/VlJIwIe+uWLOt8xV2GTLniCDo19ZpRFLiNWzaERH/ARCA==
  s3.secret_key:
    secure: v1:f/astTP+1krYBHiw:6emu8wnKgI4zJznVoh8kf2TGeBtQ3TxHkslMCUbq93jwUrJXVK/SUXylFssFQA==

  mysql.external: "false"
  # aliyun pvc shall be no less than 20Gi
  mysql.disk_size: 30
  # Mysql access configuration (required when mysql.external is true)
  mysql.host: "mysql"
  mysql.password:
    secure: v1:yEmYRN0xvZwzBMwr:BCyoWevcqd+r1dU0HqS+hCZHmOvcJUEN9vGcuNMPUQ==

  elasticsearch.external: "false"
  elasticsearch.node_amount: "3"
  # aliyun pvc shall be no less than 20Gi
  elasticsearch.disk_size: 30
  elasticsearch.cpu_cores: 4
  elasticsearch.ram_size: 16
  # Elasticsearch access configuration (required when elasticsearch.external is true)
  elasticsearch.host: "elasticsearch-es-http"
  elasticsearch.port: "9200"
  elasticsearch.protocol: "https"
  elasticsearch.password:
    secure: v1:kjReyVmrZJY9phAw:LZNmwy7DnJGXn7AN+9XyQQrk2z3UlMPyaNhvKcP3cw==

  # aliyun pvc shall be no less than 20Gi
  rabbitmq.disk_size: 20

  ragflow.image_tag: latest
  ragflow.replicas: "1"
  parser.replicas: "1"

  # Unified DeepDoc service (DLA + OCR + TSR)
  deepdoc.replicas: "1"
  deepdoc.hardware: cpu
  # deepdoc.gpu_model_series: T4
  # deepdoc.use_knative_gpu: "true"
